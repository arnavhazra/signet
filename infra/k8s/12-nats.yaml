apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: hitl
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: hitl-runtime
data:
  nats.conf: |
    server_name: nats
    port: 4222
    http_port: 8222
    jetstream {
      store_dir: /data
      max_mem: 256M
      max_file: 1G
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: hitl
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: hitl-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: hitl-runtime
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: hitl
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: hitl-runtime
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
