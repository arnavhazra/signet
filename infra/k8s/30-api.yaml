apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: hitl
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: hitl-runtime
  annotations:
    # EKS: eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/hitl-runtime-api
    addepar.dev/irsa-equivalent: kind-uses-k8s-secrets-not-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hitl
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: hitl-runtime
  annotations:
    addepar.dev/canary: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: hitl-runtime
      annotations:
        addepar.dev/canary: "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api
      containers:
        - name: api
          # Built from runtime/Dockerfile:
          #   docker build -t hitl-runtime-api:dev runtime/
          #   kind load docker-image hitl-runtime-api:dev --name hitl-runtime
          image: hitl-runtime-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: runtime-secrets
          env:
            # Python uses the OTLP HTTP exporter; collector HTTP is :4318 (gRPC is :4317).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_SERVICE_NAME
              value: hitl-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hitl
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: hitl-runtime
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
