# PLACEHOLDER secrets only — never real credentials.
# On EKS these keys come from Secrets Manager via CSI / External Secrets + IRSA.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: hitl
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: hitl-runtime
type: Opaque
stringData:
  POSTGRES_USER: hitl
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: hitl
---
apiVersion: v1
kind: Secret
metadata:
  name: runtime-secrets
  namespace: hitl
  labels:
    app.kubernetes.io/name: runtime-secrets
    app.kubernetes.io/part-of: hitl-runtime
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://hitl:changeme@postgres:5432/hitl
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://nats:4222
  JWT_SECRET: replace-me-with-a-real-jwt-secret
  API_KEYS: demo-runtime-key
