# HPA stub. On kind this is inert until metrics-server is installed.
# On EKS: enable the metrics-server add-on (or AMP adapter); this object does not change.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: hitl
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: hitl-runtime
  annotations:
    addepar.dev/stub: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
