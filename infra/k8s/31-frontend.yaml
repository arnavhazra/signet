apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: hitl
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hitl-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hitl
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: hitl-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: hitl-runtime
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          # Built from web/Dockerfile. Vite bakes VITE_API_URL at build time (nginx is static).
          # Demo (port-forward svc/frontend 3000 and svc/api 8000):
          #   docker build --build-arg VITE_API_URL=http://localhost:8000 -t hitl-runtime-web:dev web/
          #   kind load docker-image hitl-runtime-web:dev --name hitl-runtime
          # http://api:8000 is in-cluster DNS only — do not bake it into the image.
          image: hitl-runtime-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Unused by nginx; documents the in-cluster API Service name.
            - name: API_URL
              value: http://api:8000
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_SERVICE_NAME
              value: hitl-frontend
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hitl
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hitl-runtime
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
