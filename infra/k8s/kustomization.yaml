apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-secrets.yaml
  - 10-postgres.yaml
  - 11-redis.yaml
  - 12-nats.yaml
  - 20-otel-collector.yaml
  - 21-prometheus.yaml
  - 22-jaeger.yaml
  - 30-api.yaml
  - 31-frontend.yaml
  - 32-api-hpa.yaml
# Match docker build / kind load tags from runtime/Dockerfile and web/Dockerfile.
images:
  - name: hitl-runtime-api
    newName: hitl-runtime-api
    newTag: dev
  - name: hitl-runtime-web
    newName: hitl-runtime-web
    newTag: dev
